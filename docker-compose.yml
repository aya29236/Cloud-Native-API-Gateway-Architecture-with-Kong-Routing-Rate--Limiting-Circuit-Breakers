name: fintech-api-gateway

services:
  mock-upstream:
    build:
      context: ./mock-upstream
    container_name: mock-upstream
    environment:
      PORT: "8080"
    networks:
      - gateway
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    profiles: ["core"]

  kong:
    image: ${KONG_IMAGE:-kong:3.9.1}
    container_name: kong
    depends_on:
      mock-upstream:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_STATUS_LISTEN: "0.0.0.0:8100"
      KONG_LOG_LEVEL: "notice"
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
      - kong-logs:/var/log/kong
    ports:
      - "8000:8000"
      - "8443:8443"
      - "127.0.0.1:8001:8001"
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    profiles: ["core"]

  # Reserved for later layers. These services are deliberately not enabled in Gate 0.
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    networks: ["gateway"]

  alertmanager:
    image: prom/alertmanager:latest
    profiles: ["monitoring"]
    networks: ["gateway"]

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    networks: ["gateway"]

  advisor-placeholder:
    image: python:3.12-slim
    profiles: ["ai"]
    command: ["python", "-c", "print('AI profile placeholder; FastAPI service is added in Layer 1')"]
    networks: ["gateway"]

networks:
  gateway:
    name: fintech-gateway

volumes:
  kong-logs:
    name: kong-logs
