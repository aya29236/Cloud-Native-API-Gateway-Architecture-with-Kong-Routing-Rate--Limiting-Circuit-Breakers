_format_version: "9.9"
_transform: true

# Layer 1 topology (G1). Kong is DB-less: this file is the source of truth and
# the Admin API on :8001 is read-only. Each service points at an upstream ring
# of two replicas; Kong strips the public /api/<service> prefix before proxying.
# Auth and other plugins are added at Layer 2 from kong/fragments/*.yml.

services:
  # Gate 0 deterministic mock. Kept so the smoke endpoints /mock/health,
  # /mock/echo, /mock/fail and /mock/slow remain available.
  - name: mock-upstream
    url: http://mock-upstream:8080
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 1
    routes:
      - name: mock-route
        paths:
          - /mock
        strip_path: true
        methods: [GET, POST]

  - name: accounts
    host: accounts-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: accounts-route
        paths:
          - /api/accounts
        strip_path: true
        methods: [GET, POST]

  - name: payments
    host: payments-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: payments-route
        paths:
          - /api/payments
        strip_path: true
        methods: [GET, POST]

  - name: advisor
    host: advisor-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: advisor-route
        paths:
          - /api/advisor
        strip_path: true
        methods: [GET, POST]

upstreams:
  - name: accounts-upstream
    algorithm: round-robin
    targets:
      - target: accounts-1:8000
        weight: 100
      - target: accounts-2:8000
        weight: 100

  - name: payments-upstream
    algorithm: round-robin
    targets:
      - target: payments-1:8000
        weight: 100
      - target: payments-2:8000
        weight: 100

  - name: advisor-upstream
    algorithm: round-robin
    targets:
      - target: advisor-1:8000
        weight: 100
      - target: advisor-2:8000
        weight: 100
