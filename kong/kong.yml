# Layer 2 / I3 - live DB-less Kong declarative config.
# Layer 1 service/upstream topology plus explicitly merged G2-G7 plugins.
# Consumers/plugins/certificates below come from kong/fragments/*.yml.

_format_version: "3.0"

_transform: true

# Layer 1 topology (G1). Kong is DB-less: this file is the source of truth and
# the Admin API on :8001 is read-only. Each service points at an upstream ring
# of two replicas; Kong strips the public /api/<service> prefix before proxying.
# Layer 2/I3 plugins, consumers and TLS are explicitly merged below from the
# approved kong/fragments/*.yml files; no runtime merge is performed.


services:
  # Gate 0 deterministic mock. Kept so the smoke endpoints /mock/health,
  # /mock/echo, /mock/fail and /mock/slow remain available.
  - name: mock-upstream
    url: http://mock-upstream:8080
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 1
    routes:
      - name: mock-route
        paths:
          - /mock
        strip_path: true
        methods: [GET, POST]

  - name: accounts
    host: accounts-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: accounts-route
        paths:
          - /api/accounts
        strip_path: true
        methods: [GET, POST, OPTIONS]

  - name: payments
    host: payments-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: payments-route
        paths:
          - /api/payments
        strip_path: true
        methods: [GET, POST]

  - name: advisor
    host: advisor-upstream
    port: 8000
    protocol: http
    connect_timeout: 5000
    read_timeout: 10000
    write_timeout: 10000
    retries: 2
    routes:
      - name: advisor-route
        paths:
          - /api/advisor
        strip_path: true
        methods: [GET, POST]


upstreams:
  # Layer 3 / Step 3: active checks poll C1 /health; passive checks count 5xx
  # responses from real traffic. 429 is excluded so rate limiting alone does
  # not mark a healthy target as down. Source: kong/fragments/60-healthchecks.yml.
  - name: accounts-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 2
        concurrency: 10
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
    targets:
      - target: accounts-1:8000
        weight: 100
      - target: accounts-2:8000
        weight: 100

  - name: payments-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 2
        concurrency: 10
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
    targets:
      - target: payments-1:8000
        weight: 100
      - target: payments-2:8000
        weight: 100

  - name: advisor-upstream
    algorithm: round-robin
    healthchecks:
      active:
        type: http
        http_path: /health
        timeout: 2
        concurrency: 10
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
      passive:
        healthy:
          successes: 2
        unhealthy:
          http_statuses: [500, 502, 503, 504]
          http_failures: 2
          tcp_failures: 2
          timeouts: 2
    targets:
      - target: advisor-1:8000
        weight: 100
      - target: advisor-2:8000
        weight: 100

consumers:
  - username: fintech-free
    keyauth_credentials:
      - key: free-demo-key
    jwt_secrets:
      - key: fintech-free
        secret: free-jwt-secret
        algorithm: HS256

  - username: fintech-premium
    keyauth_credentials:
      - key: premium-demo-key
    jwt_secrets:
      - key: fintech-premium
        secret: premium-jwt-secret
        algorithm: HS256


plugins:
  - name: key-auth
    service: accounts
    config:
      key_names:
        - apikey
      hide_credentials: false

  - name: key-auth
    service: advisor
    config:
      key_names:
        - apikey
      hide_credentials: false

  - name: jwt
    service: payments
    config:
      key_claim_name: iss
      secret_is_base64: false
      run_on_preflight: false

  - name: rate-limiting
    consumer: fintech-free
    config:
      minute: 10
      limit_by: consumer
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: rate-limiting
    consumer: fintech-premium
    config:
      minute: 100
      limit_by: consumer
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: token-bucket
    service: payments
    consumer: fintech-free
    config:
      capacity: 5
      refill_rate: 1

  - name: token-bucket
    service: payments
    consumer: fintech-premium
    config:
      capacity: 50
      refill_rate: 10

  # I3 integration: global so every real service echoes Kong-Request-ID (C1).
  - name: correlation-id
    config:
      header_name: Kong-Request-ID
      generator: uuid#counter
      echo_downstream: true

  - name: request-transformer
    service: accounts
    config:
      add:
        headers:
          - X-Gateway:fintech-kong
      remove:
        headers:
          - X-Debug

  - name: cors
    service: accounts
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - apikey
        - Authorization
        - Content-Type
      exposed_headers:
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
        - Retry-After
        - Kong-Request-ID
      preflight_continue: false
      max_age: 600

  # I3 integration: global so every POST endpoint has the C1 413 guard.
  - name: request-size-limiting
    config:
      allowed_payload_size: 1024
      size_unit: bytes

  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

  - name: file-log
    config:
      path: /var/log/kong/access.json
      reopen: true

