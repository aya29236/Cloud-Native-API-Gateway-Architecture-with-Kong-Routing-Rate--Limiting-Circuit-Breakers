# G6 (Student C) - transformation plugins (G6, R33, R36).
# Independent-wave fragment: NOT merged into kong.yml until Layer 2 (I3).
# correlation-id echoes Kong-Request-ID downstream; request-transformer adds
# X-Gateway and removes the X-Debug header; cors exposes the rate-limit and
# correlation headers plus a tested preflight; request-size-limiting rejects
# bodies over 1 KB with 413.

plugins:
  - name: correlation-id
    service: accounts
    config:
      header_name: Kong-Request-ID
      generator: uuid#counter
      echo_downstream: true

  - name: request-transformer
    service: accounts
    config:
      add:
        headers:
          - X-Gateway:fintech-kong
      remove:
        headers:
          - X-Debug

  - name: cors
    service: accounts
    config:
      origins:
        - http://localhost:3000
      methods:
        - GET
        - POST
        - OPTIONS
      headers:
        - apikey
        - Authorization
        - Content-Type
      exposed_headers:
        - X-RateLimit-Limit-Minute
        - X-RateLimit-Remaining-Minute
        - Retry-After
        - Kong-Request-ID
      preflight_continue: false
      max_age: 600

  - name: request-size-limiting
    service: accounts
    config:
      allowed_payload_size: 1
