# Prometheus configuration — Layer 4 / M1.
# Scrapes the Kong Status API /metrics endpoint on the internal gateway network.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    project: fintech-kong-demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kong
    metrics_path: /metrics
    static_configs:
      - targets: ["kong:8100"]
