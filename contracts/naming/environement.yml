contract_version: 0.1.0
status: draft
project: fintech-api-gateway
kong:
  image: kong:3.9.1
  mode: dbless
  proxy_http_host_port: 8000
  proxy_https_host_port: 8443
  admin_host_bind: 127.0.0.1
  admin_host_port: 8001
  status_container_port: 8100
services:
  accounts: [accounts-1, accounts-2]
  payments: [payments-1, payments-2]
  advisor: [advisor-1, advisor-2]
ports:
  accounts_internal: 8000
  payments_internal: 8000
  advisor_internal: 8000
  prometheus_host: 9090
  alertmanager_host: 9093
  grafana_host: 3000
  n8n_host: 5678
  ollama_host: 11434
networks: [gateway]
volumes: [kong-logs]
compose_profiles: [core, monitoring, ai]
environment_variables:
  - KONG_IMAGE
  - KONG_PROXY_PORT
  - KONG_HTTPS_PORT
  - KONG_ADMIN_PORT
  - KONG_STATUS_PORT
